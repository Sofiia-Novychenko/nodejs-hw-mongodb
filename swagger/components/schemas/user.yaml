type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email"
    type: string
    example: 'john@example.com'
  password:
    description: "User's password"
    type: string
    example: 123456
  createdAt:
    description: 'Shows when was user created at.'
    type: string
    example: '2025-06-07T21:15:54.020Z'
  updatedAt:
    description: 'Shows when was user updated at.'
    type: string
    example: '2025-06-07T21:15:54.020Z'
