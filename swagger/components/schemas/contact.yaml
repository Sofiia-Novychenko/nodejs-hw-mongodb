type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +380000000001
  email:
    description: "Contact's email"
    type: string
    example: 'john@example.com'
  contactType:
    description: "Contact's type."
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's userId."
    type: string
    example: 65e4decdd286b30065d54af9
  isFavourite:
    description: 'Shows if contact is maked as favourite.'
    type: boolean
    example: false
  photo:
    description: "Link to Contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    description: 'Shows when was contact created at.'
    type: string
    example: '2025-06-07T21:15:54.020Z'
  updatedAt:
    description: 'Shows when was contact updated at.'
    type: string
    example: '2025-06-07T21:15:54.020Z'
